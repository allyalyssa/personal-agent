id: deposit_interest
pack: renter
title: Deposit interest your landlord owes you
pitch: SF landlords owe you interest on your security deposit every year. Most never pay it.
depth: deep
featured: true
triggers:
  documents: [lease, deposit receipt, move-in statement, rent ledger]
  phrases: [security deposit, deposit interest, my deposit, move-in, depósito de garantía, mi depósito, interés del depósito, depósito caução]
required_fields:
  deposit_amount: { type: number, label: Security deposit amount, get: extract or ask, profile: renter.deposit_amount }
  move_in_date: { type: date, label: Move-in date, get: extract or ask, profile: renter.move_in_date }
  landlord_name: { type: string, label: Landlord or property manager, get: extract or ask, profile: renter.landlord_name }
  landlord_email: { type: email, label: Landlord email, get: extract or ask, profile: renter.landlord_email }
  rental_address: { type: string, label: Rental address, get: extract or profile, profile: address }
  interest_paid_through: { type: date, label: Date interest was last paid (if ever), get: ask, optional: true }
rules: [sf_deposit_interest, sf_rent_control_coverage]
datasf: [assessor]
lookups:
  building: { dataset: assessor, address: rental_address }
guidance: >
  Look up the building in DataSF assessor data to confirm it is a residential rental in SF.
  If the user has never been paid interest, leave interest_paid_through empty; do not ask about it
  unless the document mentions interest payments. Headline the total owed with the year-by-year math.
compute:
  interest:
    fn: deposit_interest
    args: { deposit_amount: deposit_amount, move_in_date: move_in_date, interest_paid_through: interest_paid_through, year_built: building.year_built, units: building.units }
money_at_stake: interest.net_minimum
actions:
  - id: demand
    tool: send_email
    title: Email {{landlord_name}} asking for ${{$ interest.total_owed}} in deposit interest
    needs_approval: true
    due: today
    waits_on_other_party: true
    payload:
      to: "{{landlord_email}}"
      cc: "{{profile.email}}"
      subject: "Security deposit interest owed for {{rental_address}}"
      body: |
        Hello {{landlord_name}},

        I am the tenant at {{rental_address}}. I paid a security deposit of ${{$ deposit_amount}} when I moved in on {{date move_in_date}}.

        San Francisco requires landlords to pay tenants interest on security deposits each year at the rate set by the Rent Board (SF Administrative Code Chapter 49). By my records I have not received interest for the following years:

        {{lines interest.years.math}}

        Total owed: ${{$ interest.total_owed}}. If this unit is covered by the Rent Ordinance and you deduct the tenant share of the Rent Board fee, please show that deduction.

        Rates are from the SF Rent Board: {{interest.source_url}}

        Please pay this amount by check, bank transfer, or as a credit against next month's rent, within 14 days. Please also confirm the next payment of ${{$ interest.next_payment.interest}} due on {{date interest.next_payment.due_date}}.

        Thank you,
        {{profile.name}}
  - id: calendar_next
    tool: create_calendar_event
    title: Next deposit interest payment due (${{$ interest.next_payment.interest}})
    needs_approval: false
    due: interest.next_payment.due_date
    payload:
      title: "Deposit interest due from {{landlord_name}}: ${{$ interest.next_payment.interest}}"
      date: "{{interest.next_payment.due_date}}"
      note: "SF Rent Board rate {{interest.next_payment.rate_percent}}%. Source: {{interest.source_url}}"
deadlines:
  - title: Landlord response due on deposit interest demand
    due: today + 14 days
    note: Handled's follow-up window, not a legal deadline.
  - title: "Next annual deposit interest payment (${{$ interest.next_payment.interest}})"
    due: interest.next_payment.due_date
    rule: sf_deposit_interest
    remind_days_before: [3]
followups:
  - after_action: demand
    wait: 14 days
    check: Has {{landlord_name}} paid the ${{$ interest.total_owed}} in deposit interest?
    resolved_when: Payment or rent credit received
    escalate:
      id: second_notice
      tool: send_email
      title: Send a second notice to {{landlord_name}} and prepare a Rent Board filing
      needs_approval: true
      due: today
      payload:
        to: "{{landlord_email}}"
        subject: "Second notice: security deposit interest owed for {{rental_address}}"
        body: |
          Hello {{landlord_name}},

          I wrote two weeks ago asking for ${{$ interest.total_owed}} in security deposit interest owed under SF Administrative Code Chapter 49. I have not received payment.

          {{lines interest.years.math}}

          If I do not receive payment within 10 days, I plan to contact the San Francisco Rent Board about filing a petition.

          {{profile.name}}
sample: |
  Here's my lease. I moved into 1000 Guerrero St Apt 3 on November 1, 2023 and paid a $4,000 security deposit to Valencia Street Properties. I've never gotten any interest on it.
