<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pip</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; user-select: none; }
  #stage { position: fixed; right: 10px; bottom: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  #card { width: 300px; max-height: 380px; display: flex; flex-direction: column; background: #fff; color: #000; border: 1px solid #000; border-radius: 12px 12px 4px 12px; box-shadow: 0 4px 14px rgba(0, 0, 0, .25); font-size: 13px; line-height: 1.4; }
  #card[hidden] { display: none; }
  .head { padding: 10px 12px 6px; }
  .head strong { display: block; }
  .tabs { display: flex; border-bottom: 1px solid #000; padding: 0 8px; }
  .tabs button { font: inherit; background: none; border: 0; border-bottom: 2px solid transparent; padding: 4px 8px; cursor: pointer; color: #000; }
  .tabs button.on { border-color: #000; font-weight: 600; }
  .body { padding: 8px 12px; overflow-y: auto; user-select: text; }
  .body ul { margin: 4px 0; padding-left: 16px; }
  .body a { color: #000; }
  .muted { color: #555; }
  .sale { font-weight: 600; }
  .foot { display: flex; justify-content: space-between; padding: 6px 12px 10px; border-top: 1px solid #ddd; }
  .foot button, .body button { font: inherit; background: none; border: 1px solid #000; border-radius: 6px; padding: 2px 8px; cursor: pointer; color: #000; }
  #pip { width: 72px; height: 72px; cursor: grab; filter: drop-shadow(0 3px 6px rgba(0, 0, 0, .3)); animation: bob 3.2s ease-in-out infinite; }
  #pip:active { cursor: grabbing; }
  #pip img, #pip svg { width: 72px; height: 72px; object-fit: contain; pointer-events: none; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) { #pip { animation: none; } }
</style>
</head>
<body>
<div id="stage">
  <div id="card" role="status" hidden></div>
  <div id="pip"></div>
</div>
<script type="module" src="/pip.js"></script>
</body>
</html>
