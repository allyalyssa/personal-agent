<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f3d3e">
  <title>Handled</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <button class="brand" data-go="home" aria-label="Home">
      <span class="logo" aria-hidden="true"></span>
      <span>Handled</span>
    </button>
    <nav class="tabs" aria-label="Sections">
      <button data-go="home" class="tab">Home</button>
      <button data-go="gallery" class="tab">Topics</button>
      <button data-go="settings" class="tab">Settings</button>
    </nav>
  </header>

  <main id="view" tabindex="-1"></main>

  <div id="capture" class="capture" role="region" aria-label="Capture">
    <div id="listening" class="listening" hidden>
      <div class="pulse" aria-hidden="true"></div>
      <p id="transcript" class="transcript">Listening...</p>
      <div class="row">
        <button id="cancelVoice" class="ghost">Cancel</button>
        <button id="sendVoice" class="primary">Send</button>
      </div>
    </div>
    <div id="composer" class="composer" hidden>
      <textarea id="text" rows="4" placeholder="Paste an email or text, or describe what happened"></textarea>
      <div id="attachments" class="attachments"></div>
      <div class="row">
        <button id="closeComposer" class="ghost">Cancel</button>
        <button id="sendText" class="primary">Handle it</button>
      </div>
    </div>
    <div class="capture-bar">
      <label class="cap" title="Photo of a notice, bill or letter">
        <input id="photo" type="file" accept="image/*,application/pdf" capture="environment" multiple hidden>
        <span class="cap-icon cam" aria-hidden="true"></span><span>Photo</span>
      </label>
      <button id="voice" class="cap cap-main" title="Voice note">
        <span class="cap-icon mic" aria-hidden="true"></span><span>Voice</span>
      </button>
      <button id="type" class="cap" title="Type or paste">
        <span class="cap-icon pen" aria-hidden="true"></span><span>Type</span>
      </button>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
